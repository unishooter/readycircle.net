# ReadyCircle.net - Nginx site configuration
#
# This host serves the built `apps/web` static assets and reverse-proxies
# `/api/` and `/health/` to the Fastify API process running locally on the
# instance. It does NOT terminate TLS: the existing AWS Application Load
# Balancer is expected to terminate HTTPS and forward plain HTTP to this
# instance (port 80), setting the standard X-Forwarded-* headers.
#
# Install as /etc/nginx/sites-available/readycircle.conf and symlink into
# /etc/nginx/sites-enabled/, or drop directly into /etc/nginx/conf.d/ on
# distributions that don't use sites-available/sites-enabled.

upstream readycircle_api {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name readycircle.net www.readycircle.net;

  # Populated by deploy.sh on each release; points at the "current" symlink
  # so a deploy only needs to repoint the symlink and reload nginx.
  root /opt/readycircle/current/apps/web/dist;
  index index.html;

  access_log /var/log/nginx/readycircle.access.log;
  error_log  /var/log/nginx/readycircle.error.log warn;

  # ALB health checks hit this instance directly on HTTP; respond fast
  # without proxying to the API so a slow API doesn't fail LB health checks
  # that are only meant to check "is nginx up".
  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /api/ {
    proxy_pass http://readycircle_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }

  location /health/ {
    proxy_pass http://readycircle_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
    proxy_connect_timeout 3s;
  }

  # Cache fingerprinted static assets aggressively; index.html is
  # intentionally excluded so new deploys are picked up immediately.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /favicon.svg {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # SPA fallback: any route not matched above (and not an existing static
  # file) is served index.html so React Router can handle client-side
  # routing for deep links like /app/stations/123.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Never let nginx serve dotfiles (e.g. .env accidentally left in the
  # release directory).
  location ~ /\. {
    deny all;
  }
}
